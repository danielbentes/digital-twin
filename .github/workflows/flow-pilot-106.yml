name: Flow installed-package pilot 106
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  FLOW_SOURCE_REVISION: e967c29082a6647a1554fdc96312a93c6f94dd6d
concurrency:
  group: flow-pilot-106
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.actor == 'danielbentes' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      archive-sha256: ${{ steps.identity.outputs.archive-sha256 }}
    steps:
      - name: Check out reviewed pilot configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          path: target
      - name: Check out exact Flow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: synaptiai/flow-harness
          ref: ${{ env.FLOW_SOURCE_REVISION }}
          persist-credentials: false
          path: flow-source
      - name: Set up exact Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.7.0
      - name: Verify pilot control contracts
        run: node --test target/.github/scripts/*.test.mjs
      - name: Build one canonical package without pilot secrets
        working-directory: flow-source
        run: |
          test "$(git rev-parse HEAD)" = "$FLOW_SOURCE_REVISION"
          npm ci --ignore-scripts
          env -u GITHUB_SHA npm run release:prepare
      - name: Record the archive identity
        id: identity
        working-directory: flow-source
        run: |
          archive=release/package/synapti-flow-harness-0.1.0-alpha.4.tgz
          digest="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          printf 'archive-sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Flow source: `%s`\nArchive SHA-256: `%s`\n' "$FLOW_SOURCE_REVISION" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the exact public-source package before model use
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flow-pilot-106-${{ github.run_id }}-package
          path: |
            flow-source/release/package/synapti-flow-harness-0.1.0-alpha.4.tgz
            flow-source/release/package/package-release-evidence.json
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 14
  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out exact Flow verifier source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: synaptiai/flow-harness
          ref: ${{ env.FLOW_SOURCE_REVISION }}
          persist-credentials: false
      - name: Set up exact Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.7.0
      - name: Prepare Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ca-certificates curl ripgrep socat util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the exact verifier without repacking
        run: |
          test "$(git rev-parse HEAD)" = "$FLOW_SOURCE_REVISION"
          npm ci --ignore-scripts
          npm run build
      - name: Download the single prepared package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: flow-pilot-106-${{ github.run_id }}-package
          path: release/package
      - name: Require exact archive bytes and verify the installed package
        env:
          EXPECTED_PACKAGE_SHA256: ${{ needs.prepare.outputs.archive-sha256 }}
        run: |
          [[ "$EXPECTED_PACKAGE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_PACKAGE_SHA256" release/package/synapti-flow-harness-0.1.0-alpha.4.tgz | shasum -a 256 -c -
          env -u GITHUB_SHA npm run release:verify
  pilot:
    needs: [prepare, verify]
    if: github.ref == 'refs/heads/main' && github.actor == 'danielbentes' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out reviewed pilot configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          path: target
      - name: Check out exact Flow verifier source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: synaptiai/flow-harness
          ref: ${{ env.FLOW_SOURCE_REVISION }}
          persist-credentials: false
          path: flow-source
      - name: Set up exact Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.7.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare sandbox and verification dependencies without pilot secrets
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep socat util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python -m pip install mypy==1.19.1 pytest==9.0.2 ruff==0.15.12
          node --test target/.github/scripts/*.test.mjs
      - name: Download the same qualified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: flow-pilot-106-${{ github.run_id }}-package
          path: flow-source/release/package
      - name: Install and verify the retained candidate without pilot secrets
        working-directory: flow-source
        env:
          EXPECTED_PACKAGE_SHA256: ${{ needs.prepare.outputs.archive-sha256 }}
        run: |
          test "$(git rev-parse HEAD)" = "$FLOW_SOURCE_REVISION"
          [[ "$EXPECTED_PACKAGE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_PACKAGE_SHA256" release/package/synapti-flow-harness-0.1.0-alpha.4.tgz | shasum -a 256 -c -
          npm ci --ignore-scripts
          npm run build
          mkdir -p "$RUNNER_TEMP/flow-consumer" "$RUNNER_TEMP/pilot-evidence"
          archive="$PWD/release/package/synapti-flow-harness-0.1.0-alpha.4.tgz"
          sha256sum "$archive" > "$RUNNER_TEMP/pilot-evidence/package.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/pilot-evidence/source-revision.txt"
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/flow-consumer" "$archive"
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { verifyPackageReleaseArtifact, verifyInstalledPackageRelease } from './dist/infrastructure/release/package-release-verifier.js';
          const evidence = verifyPackageReleaseArtifact({
            archive: await readFile('release/package/synapti-flow-harness-0.1.0-alpha.4.tgz'),
            evidenceBytes: await readFile('release/package/package-release-evidence.json'),
            expectedSourceRevision: process.env.FLOW_SOURCE_REVISION,
          });
          await verifyInstalledPackageRelease(`${process.env.RUNNER_TEMP}/flow-consumer/node_modules/@synapti/flow-harness`, evidence);
          NODE
          "$RUNNER_TEMP/flow-consumer/node_modules/.bin/flow" --help
          "$RUNNER_TEMP/flow-consumer/node_modules/.bin/flow" compatibility check
          cat "$RUNNER_TEMP/pilot-evidence/package.sha256"
      - name: Verify evidence custody before provider use
        env:
          FLOW_PILOT_EVIDENCE_KEY: ${{ secrets.FLOW_PILOT_EVIDENCE_KEY }}
        run: node -e 'if (!/^[a-f0-9]{64}$/.test(process.env.FLOW_PILOT_EVIDENCE_KEY || "")) process.exit(1)'
      - name: Run the installed lifecycle up to the merge gate
        id: lifecycle
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.FLOW_PILOT_GH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.FLOW_PILOT_OPENROUTER_API_KEY }}
          FLOW_PILOT_BINARY: ${{ runner.temp }}/flow-consumer/node_modules/.bin/flow
          FLOW_PILOT_EVIDENCE: ${{ runner.temp }}/pilot-evidence
        run: |
          test -n "$GH_TOKEN"
          test -n "$OPENROUTER_API_KEY"
          gh auth setup-git --hostname github.com
          node .github/scripts/hosted-flow-pilot.mjs run
      - name: Seal evidence before requesting approval
        if: always()
        env:
          FLOW_PILOT_EVIDENCE_KEY: ${{ secrets.FLOW_PILOT_EVIDENCE_KEY }}
        run: bash target/.github/scripts/collect-pilot-evidence.sh preapproval
      - name: Make encrypted review evidence available to the operator
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flow-pilot-106-${{ github.run_id }}-preapproval
          path: ${{ runner.temp }}/sealed-pilot/preapproval/evidence.aes256gcm
          if-no-files-found: error
          retention-days: 7
      - name: Wait for exact external approval and prove the merge on the same runner
        if: success() && steps.lifecycle.outcome == 'success'
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.FLOW_PILOT_GH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.FLOW_PILOT_OPENROUTER_API_KEY }}
          FLOW_PILOT_BINARY: ${{ runner.temp }}/flow-consumer/node_modules/.bin/flow
          FLOW_PILOT_EVIDENCE: ${{ runner.temp }}/pilot-evidence
        run: node .github/scripts/hosted-flow-pilot.mjs approve
      - name: Seal final evidence even when the pilot fails
        if: always()
        env:
          FLOW_PILOT_EVIDENCE_KEY: ${{ secrets.FLOW_PILOT_EVIDENCE_KEY }}
        run: bash target/.github/scripts/collect-pilot-evidence.sh final
      - name: Retain final encrypted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flow-pilot-106-${{ github.run_id }}-final
          path: ${{ runner.temp }}/sealed-pilot/final/evidence.aes256gcm
          if-no-files-found: error
          retention-days: 7
