name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy pytest ruff==0.15.12

      - name: Compile Python files
        run: python -m compileall -q skills/digital-twin/scripts skills/digital-twin/references/visualization tests

      - name: Lint Python files
        run: ruff check .

      - name: Type check Python files
        run: mypy skills/digital-twin/scripts tests

      - name: Check shell syntax
        run: bash -n skills/digital-twin/scripts/pr-comment-mining.sh

      - name: Run tests
        run: python -m pytest

      - name: Set up Node for hosted pilot control tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.7.0

      - name: Verify pilot approval and evidence protection
        run: node --test .github/scripts/*.test.mjs
