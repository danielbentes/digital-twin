apiVersion: flow.synapti.ai/v1alpha1
kind: GitHubIssuePlan
repository: { expected: danielbentes/digital-twin, baseBranch: main }
branch: { prefix: flow/issue- }
candidate:
  allowedPathPrefixes:
    - skills/digital-twin/scripts/install-hook.py
    - tests/test_hook_status.py
    - commands/install-hook.md
implementation: { workflow: .flow/workflows/pilot-106-implementation.workflow.yaml }
holdout:
  stdin: { path: .flow/verification/pilot-106.py }
  command: { executable: python3, args: ["-"], timeoutMs: 120000 }
verification:
  - id: test
    command: { executable: python3, args: [-m, pytest], timeoutMs: 300000 }
  - id: compile
    command:
      executable: python3
      args: [-m, compileall, -q, skills/digital-twin/scripts, skills/digital-twin/references/visualization, tests]
      timeoutMs: 120000
  - id: lint
    command: { executable: ruff, args: [check, .], timeoutMs: 120000 }
  - id: typecheck
    command: { executable: mypy, args: [skills/digital-twin/scripts, tests], timeoutMs: 120000 }
  - id: shell-syntax
    command:
      executable: bash
      args: [-n, skills/digital-twin/scripts/pr-comment-mining.sh]
      timeoutMs: 120000
hostedChecks:
  required:
    - name: test
      sourceApp: { id: 15368, slug: github-actions }
review:
  workflow: .flow/workflows/pilot-106-review.workflow.yaml
  resultNode: review-result
  blockingSeverities: [P1, P2, P3]
merge: { method: squash, deleteBranch: true }
