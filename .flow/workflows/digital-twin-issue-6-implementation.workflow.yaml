        pressureThresholdPercent: 85
        protectedConstraints:
          - Limit this phase to pushback-detector.py and tests/test_pushback_detector_incremental.py.
          - Canonical path aliases share durable session identity; --initialize-offsets accepts inert classifier/proposal tunings, preserves valid offsets, recognizes a complete JSON record at EOF without a newline, and never replays history.
          - Short-file prefix verification hashes exactly the prior snapshot length so an ordinary append is processed rather than rebaselined as replacement.
          - Resolve default stdout and stderr at call time, and test valid-offset preservation through --initialize-offsets rather than through a normal advancing scan.
          - The 10,000-session no-op test thresholds remain unchanged; optimize discovery and unchanged checkpoints without skipping files or weakening replacement detection.
          - Untrustworthy whole state causes no proposal-directory mutation, and every replacement or truncation rebaseline warns on stderr.
          - The model has no command, Git, GitHub, credential, publication, review, or merge authority.
