r incidental ordinary prose words, omits the README no-write-to-memory boundary or focused public-interface assertions, or claims deterministic success without host evidence. The ordinary-prose restriction does not prohibit exact matching of registered command names or the two literal README contract sentences that this workflow explicitly requires; a report saying those required literals are enforced is acceptable. Do not invent additional frozen criteria from internal implementation guidance such as type-narrowing technique; lint and typecheck are authoritative host gates. This verifier checks report completeness; the controller's full checks and independent review establish correctness.

