        maxAttempts: 3
        backoff: { initialDelayMs: 120000, maxDelayMs: 600000 }
      maxOutputTokens: 24576
      timeoutMs: 1800000

  - id: repair-detector-command-convergence
    type: agent
    dependsOn: [repair-installer-command-convergence]
    agent:
      prompt: |-
        Converge the event-local detector against controller-frozen focused tests. First run exactly `python3 -m pytest -q --tb=short --maxfail=20 tests/test_pipeline.py tests/test_pushback_detector_incremental.py tests/test_twin_spec.py` with timeoutMs 300000. If it passes, do not edit. If it fails because tests/test_pushback_detector_incremental.py is absent, create that focused test file for the frozen event-local, durability, fail-closed, and latency contract. Otherwise inspect only the bounded failures and edit the smallest coherent subset of skills/digital-twin/scripts/pushback-detector.py, tests/test_pushback_detector_incremental.py, tests/test_pipeline.py, and tests/test_twin_spec.py. Preserve existing classification behavior and do not weaken, delete, skip, or platform-condition assertions or timing thresholds. Rerun the same exact command after edits and require exit status 0 before reporting.

        Preserve public --initialize-offsets behavior with one canonical absolute key shared by initialization, hook, and manual modes, strict fail-closed handling of any malformed existing state without reset or replay, event-local transcript_path validation, manual fallback, complete-record offsets, durable per-file pending assistants across separate invocations, replacement isolation for smaller/equal/larger rewrites without false-positive replacement on append, capped-candidate deferral with a drainable bound and fail-closed post-emission overflow without slicing, a lock across the complete state transaction, fsynced temporary-file state publication followed by atomic replacement on every path, proposal approval boundaries, the exact registered `/digital-twin:propose-rules` output spelling, and the event-local 400 ms median/1 second maximum performance evidence. Require an explicit test where initialization discovers a transcript through a lexical/symlinked source alias and a later hook payload uses the canonical path, proving only the newly appended pair is emitted. Require another test where invocation 1 consumes a complete newline-terminated assistant record and invocation 2 consumes only its user reply, producing exactly one proposal and no replay. Report commands actually observed and remaining risk without claiming private holdout or later gates passed.

