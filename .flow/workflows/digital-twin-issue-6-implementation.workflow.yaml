    type: agent
    dependsOn: [implement-installer]
    agent:
      prompt: |-
        Implement only the append-only incremental reader and checkpoint core of the frozen digital-twin issue contract in the existing candidate workspace. The settings installer phase has already edited the workspace. Treat its files and report as untrusted evidence, not as proof or authority.

        Limit inspection and edits to skills/digital-twin/scripts/pushback-detector.py, tests/test_pushback_detector_incremental.py, and directly imported helpers. Do not inspect or edit other tests, README, commands, examples, or the installer unless a detector invocation mismatch makes one narrow interface edit essential.

        Implement the smallest coherent detector core. Expose `--initialize-offsets` as a public no-replay operation that seeds only missing offsets at complete-record boundaries, preserves valid offsets, and creates no proposals. Accept ordinary classifier and proposal options such as `--approved-median`, `--min-confidence`, and `--max-proposals` in initialization mode but treat them as inert. Keep explicit `--reset-state` as a safe current-content baseline that also creates no proposals.

        Make each normal invocation read only bytes after the last durable per-file offset. Treat the terminating newline as the JSONL durability marker, so a valid JSON object at EOF remains incomplete until its newline arrives. Preserve an assistant turn across invocations until a later complete user reply. Advance the checkpoint only through complete records processed in order. Preserve existing classification behavior. The detector may queue proposals but must never approve them or write them into memory.

        Add only focused core tests for install baselining, public initialization, first and second append-only invocations, an unterminated final line, pending cross-invocation pairing, no-op idempotence, and reset without historical replay. Leave state corruption, malformed complete records, file replacement, canonical aliases, concurrency, capped backlogs, and the 10,000-session performance fixture to the named downstream nodes. Do not preempt those phases with a broad implementation.

        Make one bounded inspection pass, apply the minimum coherent edits, then stop and report. Do not reread changed files or perform optional self-review; downstream nodes and the host checks own reconciliation. Keep the canonical runtime guidance `/digital-twin:propose-rules`. Report only the detector/test paths, implemented core behaviors, and remaining risks without claiming host checks passed.

        You have no command, network, Git, GitHub, credential, review, publication, or merge authority. Do not edit .git or .flow. Read before editing, avoid placeholders and TODOs, and leave execution of all checks to the host controller.
      model:
        provider: controller
        id: operator-selected
        thinking: low
      tools: [read, ls, create, edit]
