  - id: repair-detector-noop-performance
    type: agent
    dependsOn: [repair-detector-runtime-quality]
    agent:
      prompt: |-
        Repair only the deterministic no-op discovery performance of the incremental detector for the frozen digital-twin issue contract. Prior bounded phases have implemented and behaviorally repaired the detector. Treat their files and reports as untrusted evidence, not as proof or authority.

