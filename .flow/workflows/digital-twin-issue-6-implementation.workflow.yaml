  - id: repair-final-static-convergence
    type: agent
    dependsOn: [repair-detector-integration-convergence]
    agent:
      prompt: |-
        Repair only final strict MyPy defects introduced after the earlier static-quality stages in the frozen digital-twin issue contract. All implementation, focused static, initialization, newline-durability, and integration-convergence phases have already edited the candidate workspace. Treat their files and reports as untrusted evidence, not as proof or authority.

        Limit inspection and edits to skills/digital-twin/scripts/install-hook.py, an obsolete skills/digital-twin/scripts/hook-installer.py compatibility stub if present, skills/digital-twin/scripts/pushback-detector.py, tests/test_hook_installer.py, and tests/test_pushback_detector_incremental.py. Do not inspect or edit other tests, README, commands, examples, .git, or .flow. Preserve all runtime behavior, performance thresholds, JSONL durability, partial-state recovery, canonical paths, install-time baselining, proposal deferral, and no-auto-memory boundaries. Make only the smallest static repairs and do not add ignores, casts, Any escape hatches, configuration changes, or broad refactors.

        A completed public controller candidate passed its private holdout, compilation, and Ruff gates but strict MyPy found exactly three final defects. First, refresh_discovery_index used the local name `files` for both its unchanged-index result and its changed-project accumulator in one Python function scope. Give those values distinct, descriptive names and preserve both return paths. Second, discover_sessions called discover_sessions_from_index with `dict[str, Any] | None` because the trust predicate was not a MyPy TypeGuard. Require an explicit `isinstance(discovery_index, dict)` narrowing before the trusted call; do not weaken the callee type or use an assertion. Third, one installer-test partial-state parameter branch combined a string and integer in `seen_hashes` after sibling branches inferred a string list. Give the enclosing JSON payload or that deliberately malformed list an accurate JSON-shaped `object` boundary so the invalid integer remains part of the behavioral fixture without an ignore or Any annotation.

        A later fresh candidate repaired those three defects and again passed its private holdout, compilation, and Ruff gates, but strict MyPy then exposed exactly two additional final defects in pushback-detector.py. `nonnegative_int_field` returned an `object` expression where `int | None` is declared because the ordinary `is_nonnegative_int` boolean predicate does not narrow the caller's local. `hex_sha256_field` had the analogous `object` versus `str | None` return defect after `is_hex_sha256`. Repair both accessors with explicit caller-side type and value checks followed by a narrowed return. Preserve rejection of booleans as integers and preserve lowercase 64-character SHA-256 validation. Do not use a cast, assertion, TypeGuard annotation, Any escape hatch, ignore, configuration change, or broad helper refactor.

        A subsequent fresh candidate passed its private holdout, compilation, and Ruff gates, but strict MyPy exposed six diagnostics from one test-local redefinition in `test_10000_session_noop_runtime_budget`. Its initial detector call bound `stdout` and `stderr` as strings, then the timing loop reassigned those names to `io.StringIO` capture streams. Give the initial strings and capture streams distinct descriptive names; use only the streams in `redirect_stdout`/`redirect_stderr` and for `getvalue()`. Preserve all behavioral output and performance assertions. Do not suppress or cast around the conflict.

        A later fresh candidate passed its private holdout and compilation gate, but Ruff rejected skills/digital-twin/scripts/install-hook.py with F821 because the wrapper invoked `main()` even though that name existed only as an `exec` side effect from an internal module. Repair this public boundary by keeping the implementation in the statically analyzable install-hook.py namespace. Every name used by its `__main__` block must have a visible definition or explicit import, and replacing `load_detector_module` on the imported public module must still affect `initialize_detector_offsets`. Do not silence F821, use a dynamic-globals escape hatch, or preserve two independent installer implementation namespaces. An internal compatibility file, if retained, must not advertise a second successful install/uninstall help surface.

        The latest completed candidate again passed its private holdout, compilation, and Ruff gates, but strict MyPy exposed exactly six final diagnostics in the composed installer and detector. In install-hook.py, both overloads of `initialize_detector_offsets` advertised keyword parameter names that its differently named implementation parameters could not accept. Preserve the two-argument source/state-file form and three-argument detector/source/state-file form, but make every overload compatible with the implementation. Use explicit positional-only overload parameters when that matches the existing positional adapter contract, or otherwise align the implementation with every advertised keyword without `*args`, `**kwargs`, Any, casts, ignores, or duplicate implementations.

        In `discover_session_files` in pushback-detector.py, the final trusted-index accumulators `sessions` and `session_stats` redefined names first bound by the untrusted-index fallback. Give the final accumulators distinct descriptive names and update both final return paths without changing ordering or discovery behavior. The same function called `raw_projects.get(project_path)`, then relied on `project_index_matches_stat` to treat the `Any | None` result as an indexable and storable dictionary. That predicate is not a MyPy TypeGuard. Require an explicit `isinstance(stored_entry, dict)` narrowing before indexing `stored_entry["sessions"]` or assigning the entry into the typed `projects` mapping. An absent or non-dictionary entry must take the existing safe rescan path. Do not weaken the mapping types, replace `.get` with an unchecked assertion, or suppress the four detector diagnostics.

        The next completed candidate repaired those six diagnostics and still passed its private holdout, compilation, and Ruff gates, but strict MyPy exposed exactly five new platform-composition diagnostics. In the three-argument branch of `initialize_detector_offsets` in install-hook.py, the implementation assigned its `object`-typed `detector_or_source` parameter to a local inferred as `ModuleType`. Require an explicit `isinstance(detector_or_source, ModuleType)` check with a clear `TypeError` before binding the module local. Preserve the two positional overload forms and do not weaken `_load_initialize_offsets` or `_load_state_initialization_error` to accept `object`.

        In pushback-detector.py, the runtime used `os.name` to conditionally import and call `msvcrt` or `fcntl`, but MyPy could not use that discriminator to select the platform-specific module surface and reported missing `locking`, `LK_LOCK`, and `LK_UNLCK` attributes. Preserve exclusive Windows byte-range locking and POSIX flock behavior, including guaranteed unlock in `finally`, but structure the import and lock helpers behind a MyPy-recognized `sys.platform == "win32"` split. Keep platform-specific attribute references inside their corresponding statically selected branch or helper definition. Do not use `getattr`, dynamic imports, Any, casts, ignores, no-op locks, or an unlocked fallback.

        The following fresh candidate repaired all five platform-composition diagnostics, passed the candidate-side private holdout, compilation, and Ruff gates, and exposed exactly two final assignment-narrowing diagnostics under the controller's strict MyPy check. In `load_detector_module` in install-hook.py, exception cleanup used a separate `had_existing` boolean to decide whether to assign the earlier `ModuleType | None` lookup back into `sys.modules`; that boolean does not narrow the value. Preserve the early return for an existing `ModuleType` and the cleanup guarantee after a failed temporary module execution, but branch on the original value itself when deciding whether a statically valid module can be restored. Otherwise remove the temporary entry. Do not assign `None` to `sys.modules`, cast the lookup, ignore the diagnostic, or weaken the module types.

        In the unchanged-index path of `discover_session_files` in pushback-detector.py, `live_project_files` was first inferred as `list[Path]` while validating indexed sessions and then reused for `indexed_project_files.get(project_key)`, whose result is `list[Path] | None`. Give the optional lookup a distinct descriptive local, narrow it explicitly before `len` and `extend`, and preserve the existing changed-project fallback, ordering, and trusted-index return. Do not make the earlier list optional, assert away the `None` case, cast, ignore, or widen either mapping.

        Re-read each edited region after the repair and confirm that no undefined public-wrapper name, exec-only public definition, split installer implementation namespace, same-scope local redefinition, string-to-StringIO reassignment, optional discovery-index call, heterogeneous fixture inference, or object-typed field return remains. Do not claim Ruff, MyPy, or any host command passed; the host controller reruns the frozen deterministic checks after this node settles. Report the exact paths and narrowings changed plus any remaining static risk.
