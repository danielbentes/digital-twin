  - id: repair-final-command-convergence
    type: agent
    dependsOn: [adversarial-contract-repair]
    agent:
      prompt: |-
        Run the final controller-declared command suite and repair only evidenced failures. The exact commands are:

        1. `python3 -m pytest -q --tb=short --maxfail=20 tests/test_hook_installer.py`
        2. `python3 -m pytest -q --tb=short --maxfail=20 tests/test_hook_public_interface.py`
        3. `python3 -m pytest -q --tb=short --maxfail=20 tests/test_pipeline.py tests/test_pushback_detector_incremental.py tests/test_twin_spec.py`
        4. `python3 -m compileall -q skills/digital-twin/scripts skills/digital-twin/references/visualization tests`
        5. `ruff check .`
        6. `mypy skills/digital-twin/scripts tests`
        7. `bash -n skills/digital-twin/scripts/pr-comment-mining.sh`
        8. `python3 -m pytest`

        Use timeoutMs 300000 for Python test commands, 120000 for compilation, Ruff, MyPy, and Bash. Run in order. On failure, inspect the bounded output and edit only the smallest coherent file within the frozen candidate paths. Create an absent required test or documentation file only when it is already named by this workflow's frozen candidate paths and needed by a declared command or criterion. Never weaken assertions, timing thresholds, configuration, typing, or lint rules. After an edit, rerun the failing command, then rerun every later command. Finish only after all eight commands have exit status 0.

        Model-authored tests are not authority to relax the frozen behavior. If a generated test conflicts with the requirements, correct the test instead of weakening production code. In particular, install and uninstall prompts must identify the action and expose either `[y/n]` or `type/enter TOKEN to confirm/continue/proceed`; do not accept ambiguous wording such as `Type 'yes' to install`. A disclosed word token must be accepted case-insensitively after trimming surrounding whitespace, and tests must parse the public prompt then submit the derived token with different capitalization. Require non-mutating decline, EOF, and unrecognized-response tests. A confirmed installer must itself invoke --initialize-offsets with the same canonical source/state paths before settings publication; a populated-history integration test must begin without state, call only install, assert the state file and canonical final-complete offset exist, then append one pair and prove the first hook proposes only that pair. Do not accept a test that directly initializes state, omits the state-existence assertion, or changes the expectation to permit missing state. Initialization failure must preserve settings and return nonzero. Tests must use explicit temporary state paths rather than changing the public default; installed settings must contain exactly one recursive detector-command reference and command-free ownership metadata; known nested command fields must be type-safe; undecodable settings JSON must preserve bytes, fail nonzero, and name `invalid`, `malformed`, or `JSON`; uninstall must restore original container structure, preserving user-authored empty hook containers while pruning only installer-created ones; the detector must expose --initialize-offsets without classification or proposal creation; every mode must key all per-file state by the same canonical absolute transcript identity so lexical aliases cannot replay history; unreadable JSON, non-object, or invalid typed existing state must fail closed without reset or replay; --hook-stdin must require hook_event_name=PostToolUse and a nonempty transcript_path; malformed hook input must never fall through to manual discovery; a complete assistant record must persist in validated per-file state across an invocation boundary until one later eligible user record consumes it; any replacement must clear that pending value while a normal append must not be mistaken for replacement; a backlog exactly at its bound must drain and only post-emission spill overflow may fail; backlog overflow must fail before state/proposal mutation; the state lock must span the full transaction; all state publication must use an fsynced temporary file and atomic replacement rather than direct truncating writes; public examples must preserve nonzero status/stderr and accurate PostToolUse cadence; and proposal-producing output must use `/digital-twin:propose-rules` rather than the unregistered space-separated spelling. Existing memory-rule description reads for unchanged deduplication remain allowed; the locality prohibition applies to unrelated session transcripts.

        Before finishing, require one coherent confirmation style whose displayed affirmative responses all work, install-only parser flags absent from uninstall without dead conditions, and bounded leading-plus-consumed-tail replacement identity. The large-file replacement regression must preserve the leading fingerprint region and length, alter the trailing pending assistant beyond that region, append only a user record, and prove no stale proposal is emitted; a subsequent fresh pair must still be processed once.

        Report each observed command status and any remaining risk. Do not claim private holdout, independent review, hosted CI, PR, or merge passed.

        You have no network, Git, GitHub, credential, private-holdout, review, publication, or merge authority. Do not access .git or .flow. Avoid dependencies, placeholders, TODOs, skips, ignores, casts, or Any escape hatches.
      model: { provider: controller, id: operator-selected, thinking: low }
      tools: [read, create, edit, exec]
      recovery:
        mode: fresh
        maxAttempts: 3
        backoff: { initialDelayMs: 120000, maxDelayMs: 600000 }
      maxOutputTokens: 24576
      timeoutMs: 2400000

  - id: verify-installer-core-tests
    type: verifier
    dependsOn: [repair-final-command-convergence]
    verifier:
      kind: command
      command:
        executable: python3
        args: [-m, pytest, -q, --tb=short, --maxfail=20, tests/test_hook_installer.py]
