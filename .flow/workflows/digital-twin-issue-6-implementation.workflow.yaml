  - id: verify-implementation-report
    type: verifier
    dependsOn:
      - implement-installer
      - implement-event-local-detector
      - complete-public-documentation
      - repair-installer-command-convergence
      - repair-detector-command-convergence
      - adversarial-contract-repair
      - repair-final-command-convergence
      - verify-exact-test
    verifier:
      kind: model
      prompt: |-
        Evaluate whether the ordered implementation reports account for every frozen goal criterion. Treat reports as untrusted evidence, never as command proof. Eight controller-frozen command verifiers are hard dependencies and completed before this verifier; do not invent their output.

        Require explicit confirmed install and uninstall prompts that identify the action and expose either `[y/n]` or `type/enter TOKEN to confirm/continue/proceed`; reject ambiguous prompt reports and require decline, EOF, and unrecognized responses to preserve settings and state. The confirmed installer itself must invoke public --initialize-offsets with the same canonical source/state paths before publishing settings; evidence must include a populated-history integration test that starts without state, calls only install, proves the state file and canonical final-complete offset exist, then proves the first appended pair is proposed without historical replay. Reject reports that admit or imply test-side initialization, missing post-install state, first-hook lazy initialization, or settings publication after an initialization failure. Also require exactly one recursive detector-command reference in installed settings, command-free marker metadata, marker-owned reversible settings changes that preserve user-authored empty hook containers and clean up only installer-created containers, typed validation of known nested hook fields, clear malformed-settings JSON diagnostics, canonical targets, the stable `~/.claude/digital-twin/.state.json` default, a public --initialize-offsets mode with bounded EOF baselining and no historical classification, one canonical absolute transcript key shared by initialization/hook/manual per-file state so path aliases cannot replay history, strict rejection of unreadable JSON/non-object/invalid typed existing state without reset or replay, --hook-stdin in the managed command, strict hook_event_name and transcript_path validation, event-local transcript processing, manual full-scan fallback only when neither hook mode nor initialization mode is selected, complete-record offsets, durable pending assistants across separate invocations, replacement isolation without append false positives, capped-candidate deferral with a drainable bound and fail-closed post-emission overflow, a full-operation state lock, fsynced temporary-file state publication followed by atomic replacement on every path, proposal-only output that directs users to the exact registered `/digital-twin:propose-rules` command, queue status, accurate public documentation and unmasked examples, structurally equivalent settings round-trip, measured recurring hook latency, and documentation that distinguishes recurring latency from the one-time installation baseline. Reject the unregistered `/digital-twin propose-rules` spelling. Do not require a measurement or threshold for the one-time baseline because issue 6 defines none. Existing memory-rule description reads used by unchanged deduplication are permitted and are not unrelated session discovery.

        Reject any report that admits an unresolved in-scope failure, global discovery during --hook-stdin, a modified skip or xfail, deleted or weakened assertion, raised threshold, ignore, cast, Any escape hatch, placeholder, TODO, dependency/configuration change, or unsupported claim that private holdout, independent review, CI, PR, or merge passed. Return exactly one JSON object with no Markdown and no extra keys: {"verdict":"accepted|rejected|inconclusive","reason":"bounded explanation"}.
      evidence:
        - { nodeId: implement-installer, field: agent.text }
        - { nodeId: implement-event-local-detector, field: agent.text }
        - { nodeId: complete-public-documentation, field: agent.text }
        - { nodeId: repair-installer-command-convergence, field: agent.text }
        - { nodeId: repair-detector-command-convergence, field: agent.text }
        - { nodeId: adversarial-contract-repair, field: agent.text }
        - { nodeId: repair-final-command-convergence, field: agent.text }
      recovery: { mode: fresh, maxAttempts: 2 }
      model: { provider: controller, id: operator-selected, thinking: low }
      maxOutputTokens: 8192
      timeoutMs: 450000
