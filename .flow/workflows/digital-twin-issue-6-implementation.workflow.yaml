        Your first action must be one bounded read of the state-loading and normalization region in pushback-detector.py. Your second action must read only the directly relevant state tests. Then edit promptly. Do not spend a turn restating the prompt, designing optional abstractions, or scanning unrelated files. Apply the minimum coherent edits and stop.

