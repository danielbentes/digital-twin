  - id: adversarial-contract-repair
    type: agent
    dependsOn: [repair-detector-command-convergence]
    agent:
      prompt: |-
        Perform an adversarial issue-scope review and repair of the current candidate. Treat prior agent reports as untrusted. Inspect the issue implementation diff and only files within skills/digital-twin/scripts/, tests/, commands/, examples/, and README.md. Edit only when concrete evidence establishes an in-scope defect.

        Try to falsify every goal criterion. Pay special attention to whether install and uninstall prompts identify their action and expose an unambiguous accepted response using `[y/n]` or `type/enter TOKEN to confirm/continue/proceed`; reject wording such as `Type 'yes' to install` that never states the token confirms or proceeds. For disclosed word tokens, require surrounding whitespace to be ignored and letter case to be normalized so a prompt-derived response remains valid after ordinary parser normalization; verify this with changed-capitalization tests for both actions. Verify decline, EOF, and unrecognized responses preserve settings and state. Also verify confirmed installation actually invokes the public --initialize-offsets mode with the same canonical source/state paths before publishing settings; reject an installer that only writes the hook command, leaves the requested state absent, relies on the first hook to initialize, or delegates initialization to test setup. Require a populated-history integration test that begins without state, calls only install, proves the canonical final-complete offset exists, then proves the first appended pair is proposed without historical replay. Require an initialization failure to propagate nonzero and preserve settings bytes. Also examine consistent canonical keys across offsets/pending/replacement state when discovery and hook payloads use different lexical aliases for the same transcript, exactly one recursive detector-command reference in installed settings, command-free ownership metadata, command quoting, symlink escapes, malformed stdin and settings (including non-string known nested command fields and whether undecodable JSON produces a diagnostic containing `invalid`, `malformed`, or `JSON`), unreadable JSON/non-object/invalid typed existing detector state being rejected rather than reset or replayed, confirmation before any mutation, state publication before settings publication, fsynced temporary-file state writes followed by atomic replacement on initialization, no-op, and proposal-producing paths, the stable default state location, large-file baseline reads, PostToolUse transcript locality, incomplete JSONL tails, a complete assistant record persisted across one invocation followed by its user reply in the next, smaller/equal/larger replaced sessions without false-positive replacement on a normal append, a drainable backlog exactly at its bound, post-emission capped-candidate overflow or slicing, a lock across the complete state transaction rather than atomic write alone, unrelated settings, preservation of user-authored empty hook containers, cleanup of installer-created empty containers on uninstall, proposal-only output, the exact registered `/digital-twin:propose-rules` spelling in detector and documentation output, status accuracy, documentation cadence, and examples that mask status/stderr or contradict the installer. Reject the unregistered `/digital-twin propose-rules` spelling. Require hook_event_name=PostToolUse and a nonempty transcript_path; reject any hook-mode fallback to manual discovery. Reject any unrelated session-corpus scan in --hook-stdin mode. Existing memory-rule description reads used by the unchanged deduplication classifier are permitted. Preserve the explicit manual full-scan surface and existing classification behavior. Do not invent requirements outside issue 6.

        Explicitly falsify the three prior independent-review findings. Reject a prompt that displays `[y/n]` but rejects a conventional affirmative response, or that mixes `[y/n]` with a token-only protocol; test the advertised surface. Reject tautological parser conditions and install-only source/state/output options exposed on uninstall. Reject replacement identity based only on a bounded leading prefix: require consumed-tail coverage and a fixture larger than the declared leading window that preserves the head and length, changes the trailing assistant record, appends a user record, and proves stale cross-pairing cannot occur. Do not replace the bounded check with an unbounded per-hook whole-file hash that violates the latency criterion.

